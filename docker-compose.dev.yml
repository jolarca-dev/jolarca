# Local development stack. CI parity lives in docker-compose.test.yml.
# Secrets come from .env (never committed; see .env.example).
#
# Host-published ports are OFFSET from the defaults on purpose: this machine
# also runs the JOL Church platform (jol-hub) and host-level PostgreSQL/Redis
# on 5432/6379/8000. Container-internal ports stay standard; only the host
# mappings differ (override via .env if your machine is free).
name: jol-marketplace-dev

services:
  db:
    build: ./backend/db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest   # dev only; prod pins a release tag (ADR-0005)
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    image: minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${AWS_S3_BUCKET} &&
      mc anonymous set download local/${AWS_S3_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  stripe-mock:
    image: stripe/stripe-mock:latest
    ports:
      - "12111:12111"

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      # .env carries the OFFSET host port (for native manage.py runs); inside
      # the compose network the db listens on the standard 5432.
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      EMAIL_HOST: mailpit
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    volumes:
      - ./backend:/app   # live reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: >
      celery -A project worker --loglevel=INFO --concurrency=2
      -Q default,email,media,ai,compliance
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AWS_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./backend:/app
    # Override the image's HTTP healthcheck (web-only): a worker serves no
    # HTTP — probe the Celery control channel instead.
    healthcheck:
      test: ["CMD-SHELL", "celery -A project inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    # /app is a read-only bind mount for appuser (uid 10001); the shelve
    # schedule file must live somewhere writable.
    command: >
      celery -A project beat --loglevel=INFO
      --schedule=/tmp/celerybeat-schedule --pidfile=/tmp/celerybeat.pid
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    volumes:
      - ./backend:/app
    # Same image-level HTTP healthcheck problem as worker; beat exposes no
    # probe surface in dev — disable rather than report a false unhealthy.
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8010}
      # Stripe Payment Element key (dev = test-mode keys from the root .env).
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      # RSC fetches run inside the container where "localhost" is the
      # container itself; server-side calls use the compose-internal name.
      INTERNAL_API_URL: http://backend:8000
      # Separate build cache from host-side `next build` output (.next).
      NEXT_DIST_DIR: .next-dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  minio-data:
