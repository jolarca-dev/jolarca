# =============================================================================
# JOL Marketplace — PRODUCTION nginx edge (TLS termination, HTTP/2).
# Mounted as /etc/nginx/templates/nginx.conf.template; the official-image
# entrypoint renders ${VARS} into /etc/nginx/nginx.conf.
#
# Security posture mirrors src/middleware.ts / next.config.js as a
# defense-in-depth floor (ISO 27001 A.8): dynamic CSP nonces belong to the
# app; the edge carries the static header set. NOTE: nginx add_header in a
# location OVERRIDES server-level headers, so every proxied location repeats
# the set via an include-free convention below (kept inline for envsubst).
#
# Brotli: stock Alpine nginx lacks ngx_brotli — gzip only. Swap the image
# for a module build if payload economics demand it.
# =============================================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Request limits — 10MB ceiling covers KYC/listing image uploads.
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # --- Rate limiting (per IP; burst absorbs honest spikes) -----------------
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    # --- Compression ----------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml;

    # --- JSON access log (machine-parseable; no PII beyond IP by design;
    #     referer/query stay PII-free because search never rides URLs) ------
    log_format json escape=json
        '{'
        '"ts":"$time_iso8601",'
        '"ip":"$remote_addr",'
        '"method":"$request_method",'
        '"host":"$host",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"rt":$request_time,'
        '"ua":"$http_sec_ch_ua",'
        '"referer":"$http_referer"'
        '}';
    access_log /var/log/nginx/access.log json;
    error_log /var/log/nginx/error.log warn;

    upstream nextjs_app {
        server app:3000;
        keepalive 32;
    }

    # --- HTTP: ACME + permanent redirect to HTTPS -----------------------------
    server {
        listen 80;
        server_name ${DOMAIN};

        # Edge health probe (does not hit the app) — also used before TLS
        # is in place during first boot.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Let's Encrypt HTTP-01 challenges.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS: TLS termination + HTTP/2 ---------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name ${DOMAIN};

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # --- Security headers (edge fallback; the app also emits these,
        #     including the per-request CSP nonce the edge cannot know) ----
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self)" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # Edge health probe.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # --- Next.js immutable hashed assets: cache 1 year -------------------
        location /_next/static/ {
            proxy_pass http://nextjs_app;
            # The edge OWNS the hardening set; the upstream (app/Django)
            # emits its own copy which would duplicate on the wire.
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self)" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            access_log off;
        }

        # --- Media / images: 1 day + stale-while-revalidate ------------------
        location ~* ^/(?:images|_next/image) {
            proxy_pass http://nextjs_app;
            # The edge OWNS the hardening set; the upstream (app/Django)
            # emits its own copy which would duplicate on the wire.
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 1d;
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self)" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        }

        # --- Django API passthrough (tightest rate limit) --------------------
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass ${BACKEND_UPSTREAM};
            # The edge OWNS the hardening set; the upstream (app/Django)
            # emits its own copy which would duplicate on the wire.
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # --- Everything else → Next.js standalone server ---------------------
        location / {
            limit_req zone=general burst=40 nodelay;
            proxy_pass http://nextjs_app;
            # The edge OWNS the hardening set; the upstream (app/Django)
            # emits its own copy which would duplicate on the wire.
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
