# JOL Marketplace — nginx edge (Alpine official image, envsubst-rendered).
# Mounted as /etc/nginx/templates/nginx.conf.template; the entrypoint renders
# ${VARS} into /etc/nginx/nginx.conf (NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx).
#
# Security posture mirrors next.config.js headers as a defense-in-depth
# fallback: even if the app regresses, the edge keeps the floor.
# NOTE: Brotli requires the third-party ngx_brotli module (not in stock
# Alpine nginx); gzip is enabled below. Add brotli via a module image if the
# payload economics demand it.

worker_processes auto;
pid /tmp/nginx.pid;   # writable by non-root-safe paths on Alpine

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Request limits — hard ceilings before rate limiting even applies.
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # --- Rate limiting (per IP; burst absorbs honest spikes) ----------------
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml;

    # --- Upstreams -------------------------------------------------------------
    upstream nextjs {
        server app:3000;
        keepalive 32;
    }
    # Django API — injected at render time (compose BACKEND_UPSTREAM).
    # envsubst note: value must include scheme, e.g. http://backend:8000.

    log_format main '$remote_addr - $request_method $host$request_uri '
                    '$status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 8080;
        server_name _;

        # --- Security headers (edge fallback; app also sets these) -----------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # Edge health probe (does not hit the app).
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # --- Next.js immutable hashed assets: cache 1 year -------------------
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # --- Public images / favicons: 1 hour ---------------------------------
        location ~* ^/(?:images|icons|favicon\.ico|robots\.txt|sitemap\.xml) {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 1h;
            add_header Cache-Control "public";
        }

        # --- Django API passthrough (rate-limited tighter) --------------------
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass ${BACKEND_UPSTREAM};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # --- Everything else → Next.js standalone server ----------------------
        location / {
            limit_req zone=general burst=40 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
