version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, security-review]
    # Group routine moves into ONE PR per ecosystem per week instead of ~10
    # single-package PRs that each consume a full CI cycle and each go stale on
    # their own — the fan-out is what stalled the queue (QODER.md §8 G19).
    # Majors are deliberately excluded from grouping: a breaking change stays a
    # discrete, revertable decision. `django` and `stripe` are excluded outright,
    # so the framework and the payment SDK are never merged inside a bundle.
    groups:
      weekly-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - django
          - stripe
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, security-review]
    # Same policy as pip. Excluded from the catch-all: `dompurify` (it is the XSS
    # sanitiser — a security control, so it lands alone and promptly) and the
    # `@stripe/*` pair. Excluded from the catch-all is NOT the same as ungrouped:
    # `@stripe/*` is its own family now (see `stripe-js-*` below), because the two
    # packages are peer-coupled in BOTH directions — `@stripe/react-stripe-js@6.12.0`
    # peers `@stripe/stripe-js >=9.16.0 <10.0.0`, and `7.0.0` peers `>=10.0.0
    # <11.0.0` — so a single-package PR for either member's major cannot resolve at
    # all. Measured on #139: Stripe.js 10.0.0 alone died in `npm ci` with an
    # `ERESOLVE` peer conflict, and the two discrete PRs also edited ADJACENT lines
    # of `frontend/package.json`, so a base move made the pair `DIRTY` on each other.
    # Grouping them keeps the PCI DSS SAQ-A review property that matters — Stripe
    # Elements is what keeps the merchant out of CHD scope, so its changes must be a
    # named, single-purpose PR and must never ride `weekly-minor-patch` — while
    # making that PR buildable. Splitting it major/patch like the families below is
    # what preserves promptness: a Stripe.js security patch must not wait on a
    # wrapper major (QODER.md §8 G20). Note the pip `stripe` SDK is a different
    # package with no such coupling and stays discrete above.
    #
    # Two families cannot be bumped apart. Verified from each branch's own files with a
    # local `npm ci --dry-run`:
    #   vitest-5.0.3            ERESOLVE While resolving: @vitest/coverage-v8@4.1.10,
    #                           Found: vitest@5.0.3   (and mirrored for coverage-v8)
    #   eslint-10.11.0          ERESOLVE While resolving: eslint-config-next@15.5.23,
    #                           Found: eslint@10.11.0
    # `eslint-config-next` is version-locked to `next` (16.3.8 depends on
    # @next/eslint-plugin-next@16.3.8 exactly), so THOSE two majors move together. It
    # does NOT follow that `eslint`'s major moves with them: a peer range is a CEILING,
    # not a licence to raise both. `eslint-config-next@16` bundles
    # `eslint-plugin-react@7.37.5`, whose newest published version still peers eslint
    # `^3 || ... || ^9.7`, and ESLint 10 removed `context.getFilename()` — measured on
    # PR #154, where the ring including eslint 10 cannot even load a config:
    # "Error while loading rule 'react/display-name': contextOrFilename.getFilename is
    # not a function". So #154 is permanently unbuildable, and eslint majors are ignored
    # below rather than grouped. (This comment previously claimed the toolchain was one
    # ring including `eslint`; that mistake is what created #154.)
    #
    # Each family is then split into a `-major` and a `-patch` group differing ONLY in
    # `update-types` (QODER.md §8 G20). Grouping majors together is necessary, but a
    # grouped PR is ATOMIC: while `vitest` + `@vitest/*` sat in a single group that
    # included `major`, the CVSS 5.9 fix for CVE-2026-84373 (vitest **4.1.11**, a patch
    # release, `main` carries 4.1.10) could only arrive inside the 5.x major-bump PR.
    # A security patch must never wait on a major release.
    #
    # Matching is made unambiguous BY CONSTRUCTION rather than by relying on group order:
    # the catch-all excludes every family pattern, and the two groups per family share
    # patterns but partition by update-type — so any single update matches exactly ONE
    # group. That matters because GitHub documents first-match-wins ordering between
    # groups, and dependabot-core #14202 reports majors being silently suppressed when
    # the first matching group excludes them. This file does not depend on that path.
    #
    # ESLint majors are blocked by an upstream ceiling, not by choice. REVISIT TRIGGER:
    # when `npm view eslint-plugin-react peerDependencies.eslint` includes 10 (or
    # eslint-config-next vendors a version that does), delete this `ignore:` block AND
    # add `eslint` / `@eslint/*` back to `next-toolchain-major` patterns in the same
    # change; `make check-deps-groups` enforces that an un-ignored eslint major is
    # either grouped or reported, so the two edits cannot be half-done silently.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/*"
        update-types: ["version-update:semver-major"]
    groups:
      weekly-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - dompurify
          - "@stripe/*"
          - vitest
          - "@vitest/*"
          - next
          - eslint
          - eslint-config-next
          - "@eslint/*"
        update-types:
          - minor
          - patch
      vitest-major:
        applies-to: version-updates
        patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - major
      vitest-patch:
        applies-to: version-updates
        patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - minor
          - patch
      # Major ring = the version-locked pair only. `eslint` / `@eslint/*` are absent
      # here on purpose: their majors are blocked upstream (see `ignore:`), so a
      # grouped eslint major would make the whole ring unbuildable, as PR #154 showed.
      next-toolchain-major:
        applies-to: version-updates
        patterns:
          - next
          - eslint-config-next
        update-types:
          - major
      next-toolchain-patch:
        applies-to: version-updates
        patterns:
          - next
          - eslint
          - eslint-config-next
          - "@eslint/*"
        update-types:
          - minor
          - patch
      # The payment-boundary pair. Both routes declare BOTH names: declaring one
      # silently files its partner alone, which is the #139 failure.
      stripe-js-major:
        applies-to: version-updates
        patterns:
          - "@stripe/stripe-js"
          - "@stripe/react-stripe-js"
        update-types:
          - major
      stripe-js-patch:
        applies-to: version-updates
        patterns:
          - "@stripe/stripe-js"
          - "@stripe/react-stripe-js"
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directories: [/backend, /frontend, /backend/db]
    schedule:
      interval: weekly
    labels: [dependencies, security-review]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [ci, security-review]
