name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # manual re-run (e.g. verifying infra/billing recovery)
  schedule:
    # Weekly full-scan regardless of new commits (ISO 27001 A.8.16 monitoring).
    - cron: "30 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks (CLI, no license required)
        run: |
          GL_VER=8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" \
            | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --source . --no-banner --redact

  trivy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Reporting only: publish a SARIF snapshot to code scanning. exit-code is 0
      # here ON PURPOSE — trivy-action builds the SARIF report with ALL severities
      # (see its "Building SARIF report with all severities" log line), so a
      # non-zero exit-code on this step would silently gate on MEDIUM/LOW as well:
      # a stricter-than-documented control that blocks every PR on any newly
      # published medium advisory. The build gate is the explicit CRITICAL,HIGH
      # step below, which enforces the severity this job actually declares.
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
      # Hard policy gate: fail the build ONLY on CRITICAL/HIGH (declared intent).
      # Reuses the trivy binary + DB installed by the action step above.
      - name: Trivy CRITICAL/HIGH policy gate
        run: |
          trivy fs --scanners vuln --vuln-type os,library --include-dev-deps --severity CRITICAL,HIGH --exit-code 1 --format table .

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read          # checkout with a job-scoped token
      actions: read           # codeql/analyze fetches workflow-run metadata
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript-typescript
      - uses: github/codeql-action/analyze@v3

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit (pinned backend deps)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements/base.txt --strict || exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  docker-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
