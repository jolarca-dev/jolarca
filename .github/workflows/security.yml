name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # manual re-run (e.g. verifying infra/billing recovery)
  schedule:
    # Weekly full-scan regardless of new commits (ISO 27001 A.8.16 monitoring).
    - cron: "30 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks (CLI, no license required)
        run: |
          GL_VER=8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" \
            | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --source . --no-banner --redact

  trivy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Reporting step: publish a SARIF snapshot of the PRODUCTION/library surface
      # to code scanning (trivy-action builds it with all severities). exit-code is
      # 0 on purpose: a non-zero exit here would silently gate on MEDIUM/LOW too
      # (the earlier severity fix). Dev-only npm advisories are covered by the
      # dedicated non-blocking dev report two steps below -- not by this step.
      # Dependabot is NOT a substitute for that report: its braces alert #38 sits
      # in auto_dismissed, so it opens no fix PR (measured 2026-10-06, §8 G34).
      - uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
      # Dev-dependency TRACKING (non-blocking): dev-only npm transitives such as
      # braces (CVE-2026-93687, HIGH, no upstream fix, reachable only via
      # eslint-config-next) leave no OPEN Dependabot alert -- #38 exists but is
      # auto_dismissed, so it queues no fix PR -- which is why this report has to
      # exist rather than the alert. Scan WITH dev deps and upload a
      # CRITICAL/HIGH SARIF with --exit-code 0 -> surfaces as a code-scanning alert
      # but never denies the pipeline. Accepted risk is documented in ADR-0018;
      # incident identifiers (and the advisory detail that must stay out of commit
      # messages) live in docs/INCIDENT_RESPONSE.md section 6.2.
      - name: Trivy dev-dependency advisory report (non-blocking)
        run: |
          trivy fs --scanners vuln --vuln-type os,library --include-dev-deps --severity CRITICAL,HIGH --exit-code 0 --format sarif --output trivy-dev.sarif .
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-dev.sarif
          # upload-sarif allows one upload per tool+category per job; give this
          # second Trivy upload a distinct category so it does not collide with
          # the production SARIF upload above (empty default category).
          category: trivy-dev-dependencies
      # Hard policy gate: fail the build on CRITICAL/HIGH in the PRODUCTION
      # dependency surface only (NO --include-dev-deps). Dev-only build/lint
      # transitives (e.g. braces via eslint-config-next) are not shipped (frontend
      # runner image copies only .next/standalone+static+public and strips npm),
      # carry no runtime exposure, and can have no upstream fix -- gating on them
      # is an unfixable denial-of-pipeline. They are tracked via the non-blocking
      # dev report above (code-scanning alerts) and accepted/remediated per ADR-0018.
      - name: Trivy CRITICAL/HIGH policy gate (production dependencies)
        run: |
          trivy fs --scanners vuln --vuln-type os,library --severity CRITICAL,HIGH --exit-code 1 --format table .

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read          # checkout with a job-scoped token
      actions: read           # codeql/analyze fetches workflow-run metadata
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript-typescript
      - uses: github/codeql-action/analyze@v3

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit (pinned backend runtime deps, base + prod)
        run: |
          pip install pip-audit
          # Runtime parity: audit BOTH base.txt AND prod.txt. prod.txt is the
          # production superset (adds gunicorn et al.); scanning only base.txt
          # left prod-only runtime pins un-gated. dev.txt is intentionally NOT
          # build-gated here -- dev-only advisories are tracked via Dependabot
          # security alerts and remediated on cadence, not denial-of-pipeline.
          pip-audit -r backend/requirements/base.txt -r backend/requirements/prod.txt --strict || exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      # §8 G35 linkage. The gates above NAME advisories; nothing used to require that a named
      # advisory became a record, so docs/INCIDENT_RESPONSE.md §6.2 depended on an operator
      # noticing -- measured 2026-10-06, when a production HIGH arrived with no Dependabot
      # alert at all. This fails when the change removes a production-scoped advisory that no
      # §6.2 row of class DEP or SEC names, or when the row exists but its ID appears in no
      # commit message or the PR text (an unattributable security fix, §Part VII). Kept
      # unconditional so the offline structural half also guards push and schedule events; the
      # attribution half needs base+head and prints SKIPPED without them. Exit 2 (cannot
      # verify) fails the job: a skipped check must never read as a pass. Two limits stated
      # rather than implied -- npm production scope only (a removed advisory in
      # backend/requirements/*.txt is not covered), and a §6.2 row must name the package as a
      # marked identifier (backticks or emphasis) rather than in plain prose, because prose that
      # happens to contain a package name would otherwise silence the check.
      - name: Advisory-to-incident-record linkage (§8 G35)
        env:
          ADV_REG_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ADV_REG_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ADV_REG_PR_NUMBER: ${{ github.event.pull_request.number }}
          # This is the first step in this repository that calls the platform API from CI, and
          # `gh` refuses to run without a token: it is not picked up implicitly the way
          # actions/* helpers handle it. Without this line every pull request would report
          # CANNOT and fail the job -- denial-of-pipeline, the G18/ADR-0018 lesson.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_advisory_register.py --self-test
          python scripts/check_advisory_register.py
      # §8 G40: every ecosystem in .github/dependabot.yml requests labels, and of 124 dependabot
      # pull requests not one ever carried `security-review` (measured 2026-10-07) -- GitHub drops a
      # label that does not exist instead of refusing the update, so the control decayed silently.
      # This asserts each named label exists as a platform object.
      #
      # DELIBERATELY NOT ENABLED. Enforcing it inside a required context is the owner's call: with
      # `enforce_admins` on, one admin and no self-bypass, a token/permission/API failure would
      # block the only operator's merge -- the G18/ADR-0018 denial-of-pipeline shape this repository
      # has already recorded twice. `vars.DEPENDABOT_LABEL_ASSERT` is unset (measured: the repo has
      # no variables), so the step is inert while the code and the wiring both exist. One platform
      # action switches it on, with no edit to this file:
      #   gh api -X PUT repos/jolarca-dev/jolarca/actions/variables \
      #     -f name=DEPENDABOT_LABEL_ASSERT -f value=true
      # That is necessary but NOT sufficient, measured rather than assumed: this job installs only
      # `pip install pip-audit`, while PyYAML (pinned 6.0.3 across base/dev/prod) reaches CI through
      # the backend job's `pip install --require-hashes -r requirements/dev.txt`. So the import fails
      # here; the checker reports that as its own CANNOT message and exits 2 -- correct behaviour,
      # still a red required job. Either give this step an interpreter that has PyYAML, or move it to
      # the backend job, which already runs check_doc_claims.py and check_dependabot_groups.py from
      # that pinned environment.
      # Two more conditions this file cannot prove from here: (1) the job token must be allowed to read
      # labels. Workflow `permissions:` declares contents:read + security-events:write; if the GET
      # returns 403 the checker exits 2 and this job goes red, which is the fail-closed direction,
      # and the remedy is adding `metadata: read` to this job. (2) Every label the config names must
      # already exist -- measured 2026-10-07 via the same endpoint, `dependencies`, `security-review`
      # and `ci` each return HTTP 200, so the assertion starts green rather than reddening the merge.
      - name: Dependabot label existence (§8 G40)
        if: ${{ vars.DEPENDABOT_LABEL_ASSERT == 'true' }}
        env:
          # gh refuses without a token; it is not picked up implicitly the way actions/* helpers
          # handle it. Same mapping the §8 G35 step above uses.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_dependabot_labels.py --self-test
          python scripts/check_dependabot_labels.py

  docker-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
