name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # manual re-run (e.g. verifying infra/billing recovery)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: jol_test
          POSTGRES_USER: jol_test
          POSTGRES_PASSWORD: jol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jol_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://jol_test:jol_test@localhost:5432/jol_test
      DJANGO_SETTINGS_MODULE: project.settings.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system deps (GDAL for PostGIS)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev
      - name: Install pinned deps
        run: pip install --require-hashes -r requirements/dev.txt
      # Dependabot group semantics are parsed by nothing else in this repo, so a
      # mis-shaped `groups:` set was invisible to every gate and only surfaced days
      # later as a missing or unmergeable PR (QODER.md §8 G20). Runs here rather than
      # as a new job on purpose: branch protection gates a fixed list of *named*
      # contexts, so a new job could fail without blocking anything (§8 G21/G22). It
      # also needs PyYAML, which the pinned dev requirements above install provides.
      # --self-test runs first so a neutered checker cannot keep the step green.
      - name: Dependabot group config check
        run: |
          python ../scripts/check_dependabot_groups.py --self-test
          python ../scripts/check_dependabot_groups.py
      # Documentation claims were the one class of assertion with no gate at all:
      # every code invariant here is machine-checked, but the docs describing those
      # controls were checked by nothing, so they drifted freely and each drift
      # became a new §8 register entry. A 2026-10-05 audit found six such claims that
      # were already registered, cited and prioritised — and still asserted as current
      # fact in CONTRIBUTING.md and README.md. This step fails the build when a
      # document asserts a control that configuration does not implement, so the next
      # one breaks a build instead of being rediscovered by hand weeks later.
      # --self-test runs first because an always-green gate is worse than none (G3).
      - name: Doc-claims check (docs must match configuration)
        run: |
          python ../scripts/check_doc_claims.py --self-test
          python ../scripts/check_doc_claims.py
      - name: Lint (ruff)
        run: ruff check .
      # `ruff check` does not verify formatting — they are separate tools (see
      # .pre-commit-config.yaml, which lists them as two hooks). Before this step
      # Python formatting was enforced only by the local pre-commit hook, while the
      # frontend had a real CI gate (npm run format:check). Parity restored.
      - name: Format check (ruff format)
        run: ruff format --check .

      # Repo tooling in scripts/ (the gate scripts themselves). Run from the REPO
      # ROOT, never as `ruff check ../scripts` from backend/: measured that ruff
      # resolves backend/pyproject.toml in that form and root ruff.toml from the
      # root, so the working directory silently picks the rule set (backend
      # line-length 100 vs root 88) and a locally-clean line fails CI.
      # QODER.md §8 G25.
      - name: Lint (ruff) - scripts/ tooling
        working-directory: ${{ github.workspace }}
        run: |
          ruff check scripts
          ruff format --check scripts
      - name: Typecheck (mypy)
        run: mypy project apps
      - name: Unit + security + contract tests
        run: |
          pytest tests/unit tests/security tests/contract --cov=. --cov-report=xml --cov-fail-under=20
          # Contract tests joined CI on 2026-10-03 (gap G7): they assert the PCI
          # SAQ-A Stripe boundary and PII non-leakage, so until now that evidence
          # was written but never produced. Coverage measured 68.8% locally with
          # them included — raise --cov-fail-under in steps from the figure CI
          # actually reports, not from a local number.
          # TODO: raise threshold toward 80% as contract/integration tests land
      - name: Migrate DB for OpenAPI check
        run: python manage.py migrate --noinput
      - name: OpenAPI drift check
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml --validate
          diff /tmp/openapi.yaml ../docs/api/openapi.yaml || \
            (echo "::error::OpenAPI snapshot stale — run 'make api-schema'" && exit 1)
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: backend/coverage.xml

  # ===========================================================================
  # Frontend pipeline — jobs 1–3 + 7 run in parallel (fail fast); 4 gates
  # the runtime-dependent jobs 5–6; .next passes as an artifact.
  # ===========================================================================

  frontend-typecheck:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit || (echo "::error::Type errors — fix before merge" && exit 1)

  frontend-lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint || (echo "::error::Lint errors — run 'npm run lint' locally" && exit 1)
      - name: Prettier check
        run: npm run format:check || (echo "::error::Formatting drift — run 'npx prettier --write .'" && exit 1)

  frontend-unit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests (Vitest, 80% coverage gate)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage

  # Independent of the build chain — contract lockstep with the backend.
  # Final frontend gate: fails any PR where src/generated/api.ts is stale.
  frontend-openapi-drift:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API contract drift check (final gate)
        run: |
          npm run api:drift || \
            (echo "::error::Generated API types stale — run 'npm run generate:api' and commit" && exit 1)

  frontend-build:
    needs: [frontend-typecheck, frontend-lint, frontend-unit]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Next.js production build (fail on warning)
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || \
            (echo "::error::Build failed — see log above" && exit 1)
          if grep -qiE "compiled with warnings|type error" build.log; then
            echo "::error::Build produced warnings — treat warnings as errors (see build.log)"
            exit 1
          fi
      - name: Standalone server CSS verification
        run: node scripts/verify-standalone.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 3

  frontend-lighthouse:
    needs: frontend-build
    runs-on: ubuntu-24.04
    # Disabled until staging environment exists (Proxmox hardware pending).
    # Re-enable by removing the 'if: false' line.
    if: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
      - name: Lighthouse CI (LCP<2000ms, CLS<0.1, TBT<200ms)
        run: |
          npx -y @lhci/cli@0.14.x autorun --config=lighthouserc.js || \
            (echo "::error::Performance budget breached — report in frontend/.lighthouseci" && exit 1)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci

  frontend-playwright-smoke:
    needs: frontend-build
    runs-on: ubuntu-24.04
    # Disabled until staging environment exists (Proxmox hardware pending).
    # Re-enable by removing the 'if: false' line.
    if: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
      - name: Install browsers
        # chromium (desktop + Pixel 7) and webkit (iPhone 14) per
        # playwright.config.ts projects.
        run: npx playwright install --with-deps chromium webkit
      - name: Start production server
        run: |
          npm run start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:3000/en > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fs http://localhost:3000/en > /dev/null || \
            (echo "::error::Server failed to start — see server.log"; cat server.log; exit 1)
      - name: Smoke tests (all locales render)
        # This job has no backend stack — journey/accessibility/GDPR
        # suites run against the Docker Compose stack (e2e/README note in
        # the config header). Keep CI pinned to the backend-free smoke.
        run: npx playwright test smoke.spec.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-smoke
          path: frontend/playwright-report
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: check_no_secrets.sh
        run: bash scripts/check_no_secrets.sh
      - name: check_secrets_dir.sh
        run: bash scripts/check_secrets_dir.sh
