name: Deploy Production

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    # This `environment:` line is NOT an approval gate, whatever this comment used to
    # claim. The `production` environment does not exist yet, and when a `v*` tag
    # auto-creates it, `can_admins_bypass` defaults to true — so with one operator who
    # is the org owner, any "required" approval here is self-grantable. See QODER.md
    # §8 G18. Removing this label entirely is queued as remediation item 12; the
    # rollout step below still fails loudly ON PURPOSE (unlike staging), because this
    # job pushes `:latest` and a green production run would read as a release that
    # never happened.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/backend:latest
          provenance: true          # SLSA provenance attestation (supply-chain evidence)
          sbom: true                # SBOM artifact (SOC 2 supply-chain evidence)
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/frontend:latest
          provenance: true
          sbom: true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: production
    steps:
      # Same sanctioned-stub policy as staging (docs/ASSUMPTIONS.md §A-07).
      # Production additionally requires: migration job runs BEFORE rollout,
      # rollback image tag recorded in the deploy log, and on-call notification.
      - name: Rollout (sanctioned stub)
        run: |
          echo "Production release ${{ github.ref_name }} built and attested."
          echo "TODO(A-07): migration job → rollout → smoke → rollback tag record."
          exit 1
